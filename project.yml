name: Yijing64
options:
  bundleIdPrefix: com.liuzixiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  YijingCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YijingCore/Sources/YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.YijingCore
        SWIFT_VERSION: "5.9"
  YijingCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YijingCore/Tests/YijingCoreTests
    dependencies:
      - target: YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.YijingCoreTests
        SWIFT_VERSION: "5.9"
        TEST_HOST: ""
  Yijing64:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yijing64
    dependencies:
      - target: YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.Yijing64
        PRODUCT_NAME: Yijing64
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 易经六十四卦
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - YijingCoreTests
schemes:
  Yijing64:
    build:
      targets:
        Yijing64: all
        YijingCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YijingCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release