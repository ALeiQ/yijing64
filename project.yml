name: Yijing64
options:
  bundleIdPrefix: com.liuzixiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.1.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  YijingCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YijingCore/Sources/YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.YijingCore
        SWIFT_VERSION: "5.9"
  YijingCoreMac:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: YijingCore/Sources/YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.YijingCoreMac
        PRODUCT_NAME: YijingCore
        SWIFT_VERSION: "5.9"
  YijingCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YijingCore/Tests/YijingCoreTests
    dependencies:
      - target: YijingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.YijingCoreTests
        SWIFT_VERSION: "5.9"
        TEST_HOST: ""
  Yijing64:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yijing64
    dependencies:
      - target: YijingCore
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.Yijing64
        PRODUCT_NAME: Yijing64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.8.1"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: 易经六十四卦
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - YijingCoreTests
  Yijing64Mac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Yijing64
    dependencies:
      - target: YijingCoreMac
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzixiang.Yijing64Mac
        PRODUCT_NAME: Yijing64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.8.1"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_KEY_CFBundleDisplayName: 易经六十四卦
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.9"
schemes:
  Yijing64:
    build:
      targets:
        Yijing64: all
        YijingCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YijingCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Yijing64Mac:
    build:
      targets:
        Yijing64Mac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release